{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigie.config.secretName" . }}
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret-key: {{ required "config.jwtSecretKey is required" .Values.config.jwtSecretKey | quote }}
{{- end }}
---
{{- if and (not .Values.mysql.existingSecret) (eq .Values.mysql.mode "standalone") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigie.mysql.secretName" . }}
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-password: {{ required "mysql.password is required" .Values.mysql.password | quote }}
  mysql-root-password: {{ required "mysql.rootPassword is required" .Values.mysql.rootPassword | quote }}
{{- end }}
---
{{- if and (not .Values.email.existingSecret) (ne .Values.email.provider "disabled") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vigie.email.secretName" . }}
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.email.provider "smtp" }}
  smtp-password: {{ .Values.email.smtp.password | quote }}
  {{- else if eq .Values.email.provider "sendgrid" }}
  sendgrid-api-key: {{ .Values.email.sendgrid.apiKey | quote }}
  {{- else if eq .Values.email.provider "mailgun" }}
  mailgun-api-key: {{ .Values.email.mailgun.apiKey | quote }}
  {{- else if eq .Values.email.provider "ses" }}
  aws-access-key: {{ .Values.email.ses.accessKey | quote }}
  aws-secret-key: {{ .Values.email.ses.secretKey | quote }}
  {{- end }}
{{- end }}
