{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vigie.fullname" . }}
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.frontend }}
        - {{ .Values.ingress.hosts.admin }}
        {{- if .Values.ingress.hosts.api }}
        - {{ .Values.ingress.hosts.api }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "vigie.fullname" .)) }}
  {{- end }}
  rules:
    # Frontend (public status page)
    - host: {{ .Values.ingress.hosts.frontend }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vigie.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
    # Admin dashboard
    - host: {{ .Values.ingress.hosts.admin }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vigie.fullname" . }}-admin
                port:
                  number: {{ .Values.admin.service.port }}
    {{- if .Values.ingress.hosts.api }}
    # API (separate host)
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vigie.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
    {{- end }}
{{- end }}
