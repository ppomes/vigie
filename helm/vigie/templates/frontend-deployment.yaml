apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigie.fullname" . }}-frontend
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
    {{- include "vigie.frontend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "vigie.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vigie.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "vigie.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            # Where nginx forwards Cachet's old public URLs and feeds
            - name: API_UPSTREAM
              value: "{{ include "vigie.fullname" . }}-api:{{ .Values.api.service.port }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
