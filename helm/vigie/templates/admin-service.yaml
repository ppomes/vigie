apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigie.fullname" . }}-admin
  labels:
    {{- include "vigie.labels" . | nindent 4 }}
    {{- include "vigie.admin.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vigie.admin.selectorLabels" . | nindent 4 }}
