services:
  # =============================================================================
  # MySQL Database Service
  # =============================================================================
  mysql:
    image: mysql:8.4
    container_name: statuspage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-statuspage}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-33306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - statuspage-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =============================================================================
  # Go API Service
  # =============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: statuspage-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-statuspage}

      # API Configuration
      PORT: ${API_PORT:-8080}
      GIN_MODE: ${GIN_MODE:-debug}

      # JWT Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}

      # Email Provider Configuration
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sendgrid}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@yourdomain.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Public addresses used in email links: where readers reach the API
      # (confirmation and unsubscribe links), and the public status page
      # (where they choose the components they follow)
      API_URL: ${API_URL:-http://localhost:8080}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # The admin, where old Cachet /dashboard links redirect
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      # Cachet compatible API: the language of Cachet's text, and the zone of
      # its dates (Cachet's APP_TIMEZONE)
      CACHET_API_LOCALE: ${CACHET_API_LOCALE:-en}
      CACHET_API_TIMEZONE: ${CACHET_API_TIMEZONE:-UTC}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - statuspage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Frontend Public Status Page Service (Vite + React)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: statuspage-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - statuspage-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # =============================================================================
  # Admin Interface Service (Vite + React)
  # =============================================================================
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: statuspage-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - statuspage-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local
    name: statuspage-mysql-data

# =============================================================================
# Networks
# =============================================================================
networks:
  statuspage-network:
    driver: bridge
    name: statuspage-network
